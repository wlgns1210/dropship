# Dropship — 단일 EC2 배포용 nginx 설정 (HTTP)
#
#   /etc/nginx/conf.d/dropship.conf 로 설치한다.
#
# TLS 를 켜면 deploy/enable-tls.sh 가 443 블록을 추가하고, 이 파일의 80 블록은
# ACME 챌린지만 남기고 나머지를 HTTPS 로 넘긴다.

upstream dropship_api {
    server unix:/run/dropship/api.sock;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    access_log /var/log/nginx/dropship.access.log;
    error_log  /var/log/nginx/dropship.error.log;

    root /var/www/dropship;
    index index.html;

    # ── Let's Encrypt 소유 증명 ──
    #
    # ^~ 가 중요하다. 이게 없으면 아래 `location /` 의 try_files 가 먼저 잡아
    # 챌린지 토큰 대신 앱 셸(404.html)을 돌려주고, 인증서 발급이 실패한다.
    # 갱신 때도 이 경로가 살아 있어야 하므로 TLS 를 켜도 남겨둔다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 80 번 블록이 무엇을 할지는 이 디렉터리 하나가 정한다.
    #
    #   TLS 꺼짐 — app.conf      (앱을 직접 서비스)
    #   TLS 켜짐 — redirect.conf (전부 HTTPS 로 넘김)
    #
    # 두 디렉터리를 각각 include 하면 둘 다 `location /` 을 갖고 있어
    # "duplicate location" 으로 nginx 가 기동하지 못한다. 하나만 읽게 해서
    # 상태가 갈리지 않도록 한다.
    include /etc/nginx/dropship-http/*.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
