# Dropship — 단일 EC2 배포용 nginx 설정
#
#   /etc/nginx/conf.d/dropship.conf 로 설치한다.
#
# 역할
#   /api/*  → FastAPI (유닉스 소켓)
#   /*      → Next.js 정적 산출물
#   내부    → 업로드된 파일을 sendfile 로 직접 전송 (X-Accel-Redirect)

upstream dropship_api {
    server unix:/run/dropship/api.sock;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 서버 정보를 굳이 알려주지 않는다.
    server_tokens off;

    # ── 업로드 본문 크기 ──
    # 파트 하나가 8MiB 다. 기본값(1m)이면 업로드가 413 으로 전부 실패한다.
    client_max_body_size 16m;
    # 본문을 임시 파일에 다 받아놓고 넘기지 않는다. 그러면 디스크를 두 번 쓰고
    # 업로드가 끝날 때까지 앱이 아무것도 못 한다. 스트리밍으로 그대로 흘린다.
    proxy_request_buffering off;
    client_body_timeout 300s;

    # ── 로그 ──
    access_log /var/log/nginx/dropship.access.log;
    error_log  /var/log/nginx/dropship.error.log;

    # ── API ──
    location /api/ {
        proxy_pass http://dropship_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 앱은 이 헤더의 **마지막** 값을 클라이언트 IP 로 쓴다.
        # $proxy_add_x_forwarded_for 가 뒤에 $remote_addr 을 붙여주므로
        # 위조된 앞쪽 값이 있어도 마지막은 항상 진짜다.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 대용량 업로드/다운로드가 프록시 타임아웃에 걸리지 않게 한다.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering off;
    }

    # ── 업로드된 파일 (내부 전용) ──
    #
    # internal 이라 외부에서 직접 열 수 없다. FastAPI 가 토큰을 확인한 뒤
    # X-Accel-Redirect: /protected/<key> 를 돌려주면 nginx 가 여기로 내부
    # 전환해 sendfile 로 보낸다. 덕분에 1GB 파일을 내려줘도 Python 은
    # 바이트를 하나도 만지지 않는다.
    location /protected/ {
        internal;
        alias /var/lib/dropship/files/;

        sendfile on;
        tcp_nopush on;
        # 이미 압축된 파일이 대부분이고, 압축하면 CPU 만 쓴다.
        gzip off;
    }

    # ── 프론트엔드 정적 파일 ──
    root /var/www/dropship;
    index index.html;

    # 해시가 박힌 빌드 산출물은 내용이 바뀌면 이름도 바뀐다. 영구 캐시 가능.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # 공유 링크(/oslo/113245)는 실제 파일이 아니다. 404 대신 404.html 을
        # 200 으로 돌려주면 Next 앱 셸이 떠서 클라이언트가 경로를 읽고 수신
        # 화면을 그린다. CloudFront 의 커스텀 오류 응답과 같은 역할이다.
        try_files $uri $uri/ /404.html;
    }

    # 404.html 자체는 200 으로 나가야 한다. 여기서 =200 을 빼면 브라우저는
    # 받지만 상태 코드가 404 라 크롤러·도구가 오해한다.
    error_page 404 =200 /404.html;

    # ── 압축 ──
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
