name: Image

# 컨테이너 이미지를 빌드해 GitHub Container Registry 로 올린다.
#
#   ghcr.io/<owner>/skiff-api
#   ghcr.io/<owner>/skiff-web
#
# 다른 VM 에서는 이 이미지를 pull 해서 compose.deploy.yaml 로 띄운다.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ghcr.io 에 밀어넣으려면 필요하다. 이게 없으면 push 단계에서 403 이 난다.
      packages: write

    strategy:
      # 하나가 실패해도 나머지는 끝까지 간다. 어느 이미지가 문제인지 한 번에 본다.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: web
            dockerfile: docker/web.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 별도 시크릿이 필요 없다. Actions 가 발급하는 토큰으로 자기 저장소의
          # 패키지에 접근할 수 있다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그 결정
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/skiff-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 레이어 캐시를 Actions 캐시에 둔다. 코드만 바뀌면 의존성 레이어를
          # 재사용해 빌드가 몇 분에서 몇십 초로 줄어든다.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # amd64 만 만든다.
          #
          # arm64(Graviton·Ampere)를 쓸 거라면 아래 줄의 주석을 풀면 된다.
          # 다만 GitHub 러너는 amd64 라 arm64 는 QEMU 에뮬레이션으로 빌드되고,
          # 특히 web 이미지의 Next.js 빌드가 10분 넘게 걸린다. 실제로 arm VM 에
          # 올릴 때만 켜는 것을 권한다.
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64

      - name: 결과
        run: |
          echo "### ${{ matrix.name }} 이미지" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
