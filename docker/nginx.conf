# Skiff — 컨테이너용 nginx 설정
#
# 호스트 배포(deploy/nginx.conf)와 다른 점은 두 가지뿐이다.
#
#   1. 업스트림이 유닉스 소켓이 아니라 **TCP** 다. 컨테이너 사이에서 소켓을
#      공유하려면 볼륨과 UID 를 맞춰야 해서 번거롭고, compose 내부 네트워크는
#      호스트에 노출되지 않으므로 TCP 로도 외부에서 API 에 직접 닿을 수 없다.
#
#   2. TLS 가 없다. 컨테이너 배포에서는 인증서를 앞단(로드밸런서·리버스 프록시·
#      Traefik 등)이 끝내는 것이 보통이다. 이 스택만으로 공개 서비스를 할
#      생각이라면 앞에 TLS 종단이 반드시 있어야 한다 — 평문으로 두면 파일이
#      그대로 오가고 링크 복사 기능도 동작하지 않는다.
#
# 라우팅 규칙 자체는 /etc/nginx/skiff-app/app.conf 로 include 한다.
# 호스트 배포와 같은 파일이라 한쪽만 고쳐서 생기는 불일치가 없다.

upstream skiff_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    # 컨테이너 로그는 표준 출력으로 내보낸다. 파일에 쌓으면 컨테이너가
    # 사라질 때 함께 사라지고, docker logs 로도 보이지 않는다.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    root /var/www/skiff;
    index index.html;

    include /etc/nginx/skiff-app/*.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
